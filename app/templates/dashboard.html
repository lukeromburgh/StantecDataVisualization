<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rainfall Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background: #0f0f13; }

    input[type="date"] {
     color: #e5e7eb;
     background-color: transparent;
   }

   input[type="date"]::-webkit-calendar-picker-indicator {
     filter: invert(1) brightness(1.4) contrast(1);
     opacity: 0.95;
    cursor: pointer;
   }
   
  input[type="date"]::-moz-focus-inner { border: 0; }
  </style>
</head>
<body class="min-h-screen text-gray-100 p-8">

  <div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-semibold mb-6">Rainfall Overview</h1>

   <div class="mb-4">
  <!-- container: column on mobile, row on sm+ -->
  <div class="flex flex-col sm:flex-row gap-3 items-stretch">
    <!-- mode buttons: full-width on mobile, inline on sm+ -->
    <div class="flex gap-2 sm:gap-3 w-full sm:w-auto" role="tablist" aria-label="Aggregation mode">
      <button id="mode-day" class="w-full sm:w-auto text-sm px-3 py-2 rounded-md bg-transparent border border-gray-700 text-gray-200">Day</button>
      <button id="mode-week" class="w-full sm:w-auto text-sm px-3 py-2 rounded-md bg-transparent border border-gray-700 text-gray-200">Week</button>
      <button id="mode-month" class="w-full sm:w-auto text-sm px-3 py-2 rounded-md bg-transparent border border-gray-700 text-gray-200">Month</button>
    </div>

    <!-- date filters: stack vertically on mobile, inline on sm+; inputs expand on mobile -->
    <div class="ml-0 sm:ml-auto flex flex-col sm:flex-row gap-2 items-stretch w-full sm:w-auto">
      <div class="flex items-center gap-2">
        <label for="start" class="text-sm text-gray-400 hidden sm:inline">From</label>
        <input id="start" type="date" class="w-full sm:w-40 rounded-md bg-[#0f0f13] border border-gray-700 text-gray-200 p-2 text-sm" />
      </div>

      <div class="flex items-center gap-2">
        <label for="end" class="text-sm text-gray-400 hidden sm:inline">To</label>
        <input id="end" type="date" class="w-full sm:w-40 rounded-md bg-[#0f0f13] border border-gray-700 text-gray-200 p-2 text-sm" />
      </div>

      <div class="flex gap-2 items-center w-full sm:w-auto">
        <button id="apply-range" class="flex-1 sm:flex-none px-3 py-2 rounded-md bg-gray-700/30 text-gray-100 text-sm">Apply</button>
        <button id="clear-range" class="flex-1 sm:flex-none px-3 py-2 rounded-md bg-transparent border border-gray-700 text-gray-200 text-sm">Clear</button>
      </div>
    </div>
  </div>
</div>

    <div class="bg-[#1a1b20] rounded-2xl p-6 shadow-xl border border-gray-700/40">
      <canvas id="rainChart" height="120"></canvas>
    </div>

    <div id="metrics" class="grid grid-cols-1 sm:grid-cols-2 gap-4 my-4">
  
  <div class="bg-[#1a1b20] p-5 rounded-2xl border border-gray-700/40 shadow">
    <p class="text-gray-400 text-sm">Total Rainfall</p>
    <p id="m-total" class="text-2xl font-semibold mt-1">—</p>
  </div>

  <div class="bg-[#1a1b20] p-5 rounded-2xl border border-gray-700/40 shadow">
    <p class="text-gray-400 text-sm">Max Daily Rainfall</p>
    <p id="m-max" class="text-xl font-semibold mt-1">—</p>
    <p id="m-max-date" class="text-gray-400 text-xs mt-1">—</p>
  </div>

  <div class="bg-[#1a1b20] p-5 rounded-2xl border border-gray-700/40 shadow">
    <p class="text-gray-400 text-sm">Average Daily Rainfall</p>
    <p id="m-avg" class="text-2xl font-semibold mt-1">—</p>
  </div>

  <div class="bg-[#1a1b20] p-5 rounded-2xl border border-gray-700/40 shadow">
    <p class="text-gray-400 text-sm">Rainy vs Dry Days</p>
    <p id="m-rainy" class="text-lg font-semibold mt-1">Rainy: —</p>
    <p id="m-dry" class="text-lg font-semibold">Dry: —</p>
  </div>

</div>
  </div>

<script>
function _getEl(id) {
  return document.getElementById(id) || null;
}

async function loadData(mode = "week", start = null, end = null) {
  window._mode = mode;
  const loadingEl = _getEl("loading");
  const errorEl = _getEl("error");

  if (loadingEl) loadingEl.classList.remove("hidden");
  if (errorEl) { errorEl.classList.add("hidden"); errorEl.textContent = ""; }

  try {
    let url = `/rainfall-data?mode=${encodeURIComponent(mode)}`;
    if (start) url += `&start=${encodeURIComponent(start)}`;
    if (end) url += `&end=${encodeURIComponent(end)}`;

    const res = await fetch(url, { credentials: "same-origin" });

    if (!res.ok) {
      // surface friendly message for 403 and other statuses
      const msg = res.status === 403
        ? "Access denied (403). Check server auth/CORS or endpoint permissions."
        : `Server returned ${res.status}`;
      if (errorEl) {
        errorEl.textContent = msg;
        errorEl.classList.remove("hidden");
      } else {
        console.error(msg);
      }
      return;
    }

    const data = await res.json();
    drawChart(data.labels || [], data.values || []);
    setActiveMode(data.mode || mode);
  } catch (err) {
    console.error("Failed to load rainfall data", err);
    if (errorEl) {
      errorEl.textContent = "Unable to load data. Check server logs.";
      errorEl.classList.remove("hidden");
    }
  } finally {
    if (loadingEl) loadingEl.classList.add("hidden");
  }
}

function drawChart(labels, values) {
  const ctx = document.getElementById("rainChart");

  if (window._rainChart) {
    window._rainChart.destroy();
  }

  window._rainChart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Rainfall",
        data: values,
        borderWidth: 2,
        borderColor: "rgb(34,197,94)",
        backgroundColor: "rgba(34,197,94,0.12)",
        tension: 0.3,
        fill: true,
        pointRadius: 0
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false }},
      scales: {
        x: { ticks: { color: "#9ca3af", maxRotation: 0, autoSkip: true }, grid: { color: "rgba(255,255,255,0.03)" }},
        y: { ticks: { color: "#9ca3af" }, grid: { color: "rgba(255,255,255,0.03)" }}
      },
      onClick: function(evt, elems) {
        if (!elems.length) return;
        const idx = elems[0].index;
        const label = this.data.labels[idx];
        // drill: week -> show days for that week; month -> show month days; day -> no-op
        if (window._mode === "week") {
          // label is YYYY-MM-DD (week start). drill to day range: start -> +7 days
          const start = new Date(label);
          const end = new Date(start);
          end.setDate(start.getDate() + 7);
          const startISO = start.toISOString().slice(0,10);
          const endISO = end.toISOString().slice(0,10);
          // set date inputs to reflect drill and load day data
          document.getElementById("start").value = startISO;
          document.getElementById("end").value = endISO;
          loadData("day", startISO, endISO);
        } else if (window._mode === "month") {
          // label is YYYY-MM, drill to that month (first -> next month)
          const [y, m] = label.split("-");
          const start = new Date(Number(y), Number(m)-1, 1);
          const end = new Date(start);
          end.setMonth(start.getMonth() + 1);
          const startISO = start.toISOString().slice(0,10);
          const endISO = end.toISOString().slice(0,10);
          document.getElementById("start").value = startISO;
          document.getElementById("end").value = endISO;
          loadData("day", startISO, endISO);
        }
      }
    }
  });
}

function setActiveMode(mode) {
  const mapping = { day: "mode-day", week: "mode-week", month: "mode-month" };
  Object.values(mapping).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove("bg-gray-700", "text-white", "font-semibold", "border-gray-600");
    el.classList.add("bg-transparent", "border-gray-700/50", "text-gray-400");
  });
  const active = document.getElementById(mapping[mode] || "mode-week");
  if (active) {
    active.classList.remove("bg-transparent", "border-gray-700/50", "text-gray-400");
    active.classList.add("bg-gray-700", "text-white", "font-semibold", "border-gray-600");
  }
}

document.getElementById("mode-day").addEventListener("click", () => loadData("day"));
document.getElementById("mode-week").addEventListener("click", () => loadData("week"));
document.getElementById("mode-month").addEventListener("click", () => loadData("month"));

document.getElementById("apply-range").addEventListener("click", () => {
  const start = document.getElementById("start").value || null;
  const end = document.getElementById("end").value || null;
  loadData(window._mode || "week", start, end);
});
document.getElementById("clear-range").addEventListener("click", () => {
  document.getElementById("start").value = "";
  document.getElementById("end").value = "";
  loadData(window._mode || "week", null, null);
});

async function loadStats() {
  const res = await fetch("/rainfall-stats");
  const s = await res.json();
  document.getElementById("m-total").textContent = `${s.total_rainfall.toFixed(1)} mm`;
  document.getElementById("m-max").textContent = `${s.max_daily.toFixed(1)} mm`;
  document.getElementById("m-max-date").textContent = `(${s.max_daily_date})`;
  document.getElementById("m-avg").textContent = `${s.avg_daily.toFixed(2)} mm`;
  document.getElementById("m-rainy").textContent = `Rainy: ${s.rainy_days}`;
  document.getElementById("m-dry").textContent = `Dry: ${s.dry_days}`;
}

loadStats();
loadData("week");
</script>

</body>
</html>
