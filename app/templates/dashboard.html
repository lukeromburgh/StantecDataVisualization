<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rainfall Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background: #0f0f13; }
  </style>
</head>
<body class="min-h-screen text-gray-100 p-8">

  <div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-semibold mb-6">Rainfall Overview</h1>

    <div class="flex gap-2 mb-4">
      <button id="mode-day" class="px-3 py-1 rounded-md bg-transparent border border-gray-700 text-gray-200">Day</button>
      <button id="mode-week" class="px-3 py-1 rounded-md bg-transparent border border-gray-700 text-gray-200">Week</button>
      <button id="mode-month" class="px-3 py-1 rounded-md bg-transparent border border-gray-700 text-gray-200">Month</button>
    </div>

    <div class="bg-[#1a1b20] rounded-2xl p-6 shadow-xl border border-gray-700/40">
      <canvas id="rainChart" height="120"></canvas>
    </div>

    <div id="metrics" class="grid grid-cols-1 sm:grid-cols-2 gap-4 my-4">
  
  <div class="bg-[#1a1b20] p-5 rounded-2xl border border-gray-700/40 shadow">
    <p class="text-gray-400 text-sm">Total Rainfall</p>
    <p id="m-total" class="text-2xl font-semibold mt-1">—</p>
  </div>

  <div class="bg-[#1a1b20] p-5 rounded-2xl border border-gray-700/40 shadow">
    <p class="text-gray-400 text-sm">Max Daily Rainfall</p>
    <p id="m-max" class="text-xl font-semibold mt-1">—</p>
    <p id="m-max-date" class="text-gray-400 text-xs mt-1">—</p>
  </div>

  <div class="bg-[#1a1b20] p-5 rounded-2xl border border-gray-700/40 shadow">
    <p class="text-gray-400 text-sm">Average Daily Rainfall</p>
    <p id="m-avg" class="text-2xl font-semibold mt-1">—</p>
  </div>

  <div class="bg-[#1a1b20] p-5 rounded-2xl border border-gray-700/40 shadow">
    <p class="text-gray-400 text-sm">Rainy vs Dry Days</p>
    <p id="m-rainy" class="text-lg font-semibold mt-1">Rainy: —</p>
    <p id="m-dry" class="text-lg font-semibold">Dry: —</p>
  </div>

</div>
  </div>

<script>
async function loadData(mode = "week") {
  const res = await fetch(`/rainfall-data?mode=${mode}`);
  const data = await res.json();
  drawChart(data.labels, data.values, data.mode);
  setActiveMode(data.mode);
}

function drawChart(labels, values) {
  const ctx = document.getElementById("rainChart");

  if (window._rainChart) {
    window._rainChart.destroy();
  }

  window._rainChart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Rainfall",
        data: values,
        borderWidth: 2,
        borderColor: "rgb(34,197,94)",
        backgroundColor: "rgba(34,197,94,0.12)",
        tension: 0.3,
        fill: true,
        pointRadius: 0
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false }},
      scales: {
        x: {
          ticks: { color: "#9ca3af", maxRotation: 0, autoSkip: true },
          grid: { color: "rgba(255,255,255,0.03)" }
        },
        y: {
          ticks: { color: "#9ca3af" },
          grid: { color: "rgba(255,255,255,0.03)" }
        }
      }
    }
  });
}

function setActiveMode(mode) {
  const mapping = { day: "mode-day", week: "mode-week", month: "mode-month" };
  Object.values(mapping).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove("bg-gray-700", "text-white", "font-semibold", "border-gray-600");
    el.classList.add("bg-transparent", "border-gray-700/50", "text-gray-400");
  });
  const active = document.getElementById(mapping[mode] || "mode-week");
  if (active) {
    active.classList.remove("bg-transparent", "border-gray-700/50", "text-gray-400");
    active.classList.add("bg-gray-700", "text-white", "font-semibold", "border-gray-600");
  }
}

document.getElementById("mode-day").addEventListener("click", () => loadData("day"));
document.getElementById("mode-week").addEventListener("click", () => loadData("week"));
document.getElementById("mode-month").addEventListener("click", () => loadData("month"));

async function loadStats() {
  const res = await fetch("/rainfall-stats");
  const s = await res.json();
  document.getElementById("m-total").textContent = `${s.total_rainfall.toFixed(1)} mm`;
  document.getElementById("m-max").textContent = `${s.max_daily.toFixed(1)} mm`;
  document.getElementById("m-max-date").textContent = `(${s.max_daily_date})`;
  document.getElementById("m-avg").textContent = `${s.avg_daily.toFixed(2)} mm`;
  document.getElementById("m-rainy").textContent = `Rainy: ${s.rainy_days}`;
  document.getElementById("m-dry").textContent = `Dry: ${s.dry_days}`;
}

loadStats();
loadData("week");
</script>

</body>
</html>
