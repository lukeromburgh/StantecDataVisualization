<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rainfall Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background: #0f0f13; }
  </style>
</head>
<body class="min-h-screen text-gray-100 p-8">

  <div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-semibold mb-6">Rainfall Overview</h1>

    <div class="bg-[#1a1b20] rounded-2xl p-6 shadow-xl border border-gray-700/40">
      <canvas id="rainChart" height="120"></canvas>
    </div>
  </div>

<script>
async function loadData() {
  const res = await fetch("/rainfall-data-simple");
  const data = await res.json();
  drawChart(data.labels, data.values);
}

function drawChart(labels, values) {
  const ctx = document.getElementById("rainChart");

  new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Daily Rainfall (mm)",
        data: values,
        borderWidth: 2,
        borderColor: "rgb(34,197,94)",
        backgroundColor: "rgba(34,197,94,0.2)",
        tension: 0.3,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false }},
      scales: {
        x: {
          ticks: { color: "#9ca3af" },
          grid: { color: "rgba(255,255,255,0.05)" }
        },
        y: {
          ticks: { color: "#9ca3af" },
          grid: { color: "rgba(255,255,255,0.05)" }
        }
      }
    }
  });
}

loadData();
</script>

</body>
</html>
